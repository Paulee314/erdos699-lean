version: "v0.4"

project:
  name: "Erdős Problem 699: every counterexample has n ≤ j²"
  description: >-
    Erdős Problem 699 (Erdős and Szekeres 1978) asks whether for every 1 ≤ i < j ≤ n/2 there is a
    prime p ≥ i dividing gcd(C(n, i), C(n, j)). The problem is open. Using the statement from
    google-deepmind/formal-conjectures with the single extra hypothesis j² < n, this project
    proves in Lean 4 with Mathlib that the answer is yes whenever j² < n; equivalently, every
    counterexample (n, i, j) has n ≤ j². The proof combines the Erdős–Szekeres inequality
    gcd(C(n, i), C(n, j)) ≥ C(n, i)/C(j, i) ≥ (n/j)^i, which follows from the identity
    C(n, j) C(j, i) = C(n, i) C(n − i, j − i), with an upper bound for a gcd whose prime factors
    are all below i: each prime power in C(n, i) is at most n (Kummer), and there are at most i/2
    primes below i, so such a gcd is at most n^(i/2). The bound reduces the problem to j ≥ √n.
    With a computer search of every n < 10^12 (not part of this formalization) it rules out
    counterexamples with j ≤ 10^6. The argument is short and may well be folklore;
    formal-conjectures records the problem but no partial result of this kind.
  authors:
    - "Paul Lee"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Paul Lee"

classification:
