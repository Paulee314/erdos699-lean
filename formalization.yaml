      - "George Szekeres"
    type: "article"
    location: "Austral. Math. Soc. Gaz. 5 (1978), 97–99"
    relationship: "background"
    note: >-
      Origin of the problem (see also https://www.erdosproblems.com/699). The paper proves
      gcd(C(n, i), C(n, j)) ≥ C(n, i)/C(j, i), which is the first step of the proof here
      (choose_dvd_gcd_mul).
  - title: "Erdős Problem 699: search to 10^12 and the bound n ≤ j²"
    authors:
      - "Paul Lee"
    type: "web post"
    location: "https://github.com/Paulee314/erdos699"
    relationship: "formalizes"
    note: >-
      The README of this repository states and proves the bound n ≤ j² informally ("The lemma
